services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: streamdoctor
      POSTGRES_DB: streamdoctor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U streamdoctor"]
      interval: 5s
      timeout: 5s
      retries: 10
  ai:
    build:
      context: .
      dockerfile: ai_agent/Dockerfile
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set AI_SERVICE_TOKEN in .env}
    restart: unless-stopped
  api:
    build: ./backend
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://streamdoctor:${POSTGRES_PASSWORD}@db:5432/streamdoctor
      UPLOAD_DIR: /app/storage/photos
      AI_MODE: http
      AI_SERVICE_URL: http://ai:9000/analyze
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN}
      CORS_ORIGINS: '["http://localhost:8080"]'
    command: [sh, -c, "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers"]
    volumes:
      - photos:/app/storage/photos
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_started
    restart: unless-stopped
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
    restart: unless-stopped
volumes:
  database:
  photos:
