services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: streamdoctor
      POSTGRES_USER: streamdoctor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamdoctor -d streamdoctor"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      UPLOAD_DIR: /app/storage/photos
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://streamdoctor:${POSTGRES_PASSWORD}@db:5432/streamdoctor
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:5173","http://localhost:3000"]}'
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-60}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-10}
      AUTH_RATE_WINDOW_SECONDS: ${AUTH_RATE_WINDOW_SECONDS:-60}
    volumes:
      - photo_data:/app/storage
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers"]
volumes:
  postgres_data:
  photo_data:
